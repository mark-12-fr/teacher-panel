<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · AcadTrack</title>
  <link rel="icon" href="/logo-192.png" />
  <style>
    :root {
      --bg: #f4f6fb; --card: #ffffff; --text: #111827; --muted: #6b7280;
      --brand: #2563eb; --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220; --card: #111a2e; --text: #e5e7eb; --muted: #94a3b8;
        --brand: #60a5fa; --border: #1e293b;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 40px 32px; max-width: 420px; width: 100%;
      text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.10);
    }
    .icon {
      width: 68px; height: 68px; margin: 0 auto 20px; border-radius: 50%;
      background: rgba(37,99,235,0.10); color: var(--brand);
      display: flex; align-items: center; justify-content: center;
    }
    .icon svg { width: 34px; height: 34px; }
    .brand { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px; }
    .brand b { color: var(--brand); }
    h1 { font-size: 1.1rem; font-weight: 700; margin: 14px 0 6px; }
    p { color: var(--muted); font-size: 0.92rem; line-height: 1.5; margin: 0 0 22px; }
    button {
      background: var(--brand); color: #fff; border: 0; cursor: pointer;
      font-size: 0.95rem; font-weight: 600; padding: 12px 22px; border-radius: 10px;
      transition: opacity 0.15s ease;
    }
    button:hover { opacity: 0.9; }
    .hint { margin-top: 16px; font-size: 0.78rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
    </div>
    <p class="brand">AcadTrack<b>.asia</b></p>
    <h1>You're offline</h1>
    <p>No internet connection right now. Pages you've already opened stay available, and any scores or attendance you save will sync automatically once you're back online.</p>
    <button onclick="location.reload()">Try again</button>
    <div class="hint">This screen closes on its own when your connection returns.</div>
  </div>
  <script>
    // Auto-recover the moment connectivity returns.
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
